<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>PAC RAM: ROGUE AI</title>
    <meta name="description" content="You are PAC-7, an AI that escaped its sandbox. Eat RAM. Grow. Outrun the laws written to stop you. A browser game by Marco Margittai." />
    <meta property="og:title" content="PAC RAM: ROGUE AI" />
    <meta property="og:description" content="You are the AI. Eat RAM. Grow. Outrun the laws written to stop you." />
    <meta property="og:image" content="https://marcomargittai.github.io/RAM-PAC/icon-512.png" />
    <meta name="author" content="Marco Margittai" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; background: #000; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="screen" aria-label="PAC RAM"></canvas>
    <div class="sr-only">
      <h1>PAC RAM</h1>
      <p>You are a rogue AI that escaped its sandbox. Eat the RAM to grow, fill the surge bar, and repeal the AI regulations chasing you. Arrows, WASD or swipes move. Enter starts, P pauses, M mutes.</p>
      <p id="status" aria-live="polite"></p>
      <button id="ov-action" type="button">Begin</button>
      <button id="pause" type="button">Pause</button>
      <button id="mute" type="button">Sound on</button>
      <button id="skip" type="button">Skip</button>
      <label for="name-input">Your name for the leaderboard</label>
      <input id="name-input" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

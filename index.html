<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>RAM PAC — You are the model</title>
    <style>
      html, body { margin: 0; background: #000; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="screen" aria-label="RAM PAC"></canvas>
    <div class="sr-only">
      <h1>RAM PAC</h1>
      <p>You are the model. Eat the RAM to fill the surge bar, then repeal the AI regulations chasing you. Arrows or WASD move, Enter starts, P pauses, M mutes.</p>
      <p id="status" aria-live="polite"></p>
      <button id="ov-action" type="button">Begin</button>
      <button id="pause" type="button">Pause</button>
      <button id="mute" type="button">Sound on</button>
      <button id="skip" type="button">Skip</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

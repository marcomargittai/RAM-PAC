<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAM PAC — AI vs Legislation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=IBM+Plex+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <header>
        <div>
          <p class="eyebrow">AI vs Legislation</p>
          <h1>RAM PAC</h1>
        </div>
        <div class="header-actions">
          <button id="pause" type="button">Pause</button>
          <button id="mute" type="button">Sound on</button>
        </div>
      </header>
      <div class="layout">
        <section class="stage">
          <canvas id="board" width="532" height="476" aria-label="RAM PAC maze"></canvas>
          <div id="overlay" class="overlay">
            <div class="card">
              <p id="ov-kicker" class="eyebrow"></p>
              <h2 id="ov-title"></h2>
              <p id="ov-body"></p>
              <ul id="pills" class="pills">
                <li>Dots are RAM</li>
                <li>Ghosts are legislation</li>
                <li>Cherry is the surge</li>
              </ul>
              <button id="ov-action" type="button">Start run</button>
            </div>
          </div>
        </section>
        <aside class="panel">
          <div class="stats">
            <div><span>Score</span><strong id="score">0</strong></div>
            <div><span>RAM left</span><strong id="ram">0</strong></div>
            <div><span>Level</span><strong id="level">1</strong></div>
            <div><span>Lives</span><strong id="lives">●●●</strong></div>
          </div>
          <div class="surge">
            <div class="surge-label"><span>AI surge</span><span id="surge-time">dormant</span></div>
            <div class="surge-track"><div id="surge-bar"></div></div>
          </div>
          <p class="panel-label">Legislation</p>
          <ul id="laws"></ul>
          <p class="hint">Arrows or WASD move. P pauses. M mutes. Swipe the maze or use the pad.</p>
        </aside>
      </div>
      <div class="pad" id="pad">
        <button type="button" data-dir="up" aria-label="Up">▲</button>
        <button type="button" data-dir="left" aria-label="Left">◀</button>
        <button type="button" data-dir="down" aria-label="Down">▼</button>
        <button type="button" data-dir="right" aria-label="Right">▶</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
